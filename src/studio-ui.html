<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mise Studio — Parasol</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
:root{
  --paper:#FAFAF7; --card:#FFF; --card2:#F0F1EC; --ink:#191A18; --ink2:#55584F; --ink3:#8A8E84;
  --rule:#DEE0D8; --rule2:#EAEBE5; --accent:#2E4E6B; --accentbg:#E5EDF4;
  --warn:#8A6321; --warnbg:#F6EDDC; --flag:#A83A26; --flagbg:#F7E9E4; --ok:#2F6A4F; --okbg:#E4F0E9;
}
@media (prefers-color-scheme:dark){:root{
  --paper:#101210; --card:#181B18; --card2:#1F231F; --ink:#E9EBE5; --ink2:#AAB0A6; --ink3:#787E76;
  --rule:#2E332E; --rule2:#242924; --accent:#86AECE; --accentbg:#16242F;
  --warn:#D6A94F; --warnbg:#29220F; --flag:#E08066; --flagbg:#2C1B15; --ok:#7FBF9C; --okbg:#16261E;
}}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);
     font-family:Archivo,system-ui,sans-serif;font-size:14.5px;line-height:1.5}
.mono{font-family:"JetBrains Mono",ui-monospace,monospace}

/* ---- shell ---- */
.app{display:grid;grid-template-rows:auto 1fr;height:100vh}
header{display:flex;align-items:center;gap:14px;padding:11px 18px;
       border-bottom:1px solid var(--rule);background:var(--card)}
header h1{margin:0;font-size:.95rem;font-weight:700;letter-spacing:-.01em}
header .env{font-family:"JetBrains Mono",monospace;font-size:.63rem;letter-spacing:.1em;
            text-transform:uppercase;padding:3px 8px;border-radius:2px;background:var(--card2);color:var(--ink3)}
header .grow{flex:1}
.kpi{font-family:"JetBrains Mono",monospace;font-size:.66rem;padding:4px 9px;border-radius:2px;
     background:var(--card2);color:var(--ink2);white-space:nowrap}
.kpi.warn{background:var(--warnbg);color:var(--warn)}
.kpi.flag{background:var(--flagbg);color:var(--flag)}
button{font:inherit;cursor:pointer;border-radius:3px;border:1px solid var(--rule);
       background:var(--card);color:var(--ink);padding:7px 13px;font-size:.85rem}
button:hover{border-color:var(--ink3)}
button.primary{background:var(--accent);color:var(--paper);border-color:transparent;font-weight:600}
button.primary:disabled{opacity:.5;cursor:default}
button.ghost{border-color:transparent;background:transparent;color:var(--ink2)}

.cols{display:grid;grid-template-columns:300px 1fr 400px;min-height:0}
@media(max-width:1180px){.cols{grid-template-columns:270px 1fr}.preview{display:none}}
@media(max-width:800px){.cols{grid-template-columns:1fr}.list{display:none}.cols.showlist .list{display:block}
  .cols.showlist .editor{display:none}}

/* ---- list ---- */
.list{border-right:1px solid var(--rule);overflow-y:auto;background:var(--card)}
.queue{padding:12px 16px;background:var(--warnbg);border-bottom:1px solid var(--rule)}
.queue h2{margin:0 0 3px;font-size:.78rem;font-weight:700;color:var(--warn)}
.queue p{margin:0;font-size:.78rem;color:var(--warn);line-height:1.45}
.sec{font-family:"JetBrains Mono",monospace;font-size:.6rem;letter-spacing:.14em;text-transform:uppercase;
     color:var(--ink3);padding:13px 16px 6px;position:sticky;top:0;background:var(--card);
     border-bottom:1px solid var(--rule2);z-index:1}
.row{display:block;width:100%;text-align:left;border:none;border-bottom:1px solid var(--rule2);
     border-radius:0;background:none;padding:9px 16px}
.row:hover{background:var(--card2)}
.row[aria-current=true]{background:var(--accentbg);box-shadow:inset 3px 0 0 var(--accent)}
.row .n{font-size:.9rem;font-weight:600;display:block;letter-spacing:-.005em}
.row .p{font-family:"JetBrains Mono",monospace;font-size:.66rem;color:var(--ink3);display:block;margin-top:1px}
.row.stub .n{color:var(--warn)}
.dot{display:inline-block;width:6px;height:6px;border-radius:50%;margin-left:6px;vertical-align:middle}
.dot.stub{background:var(--warn)} .dot.out{background:var(--flag)} .dot.stale{background:var(--warn);opacity:.55}

/* ---- editor ---- */
.editor{overflow-y:auto;padding:0 0 60px}
.pad{padding:20px 26px 28px;max-width:640px}
.empty{color:var(--ink3);padding:60px 26px;text-align:center}
.crumb{font-family:"JetBrains Mono",monospace;font-size:.64rem;letter-spacing:.1em;
       text-transform:uppercase;color:var(--ink3);margin-bottom:6px}
.editor h2{margin:0 0 16px;font-size:1.5rem;letter-spacing:-.025em}
fieldset{border:1px solid var(--rule);border-radius:3px;padding:16px 18px 18px;margin:0 0 18px;background:var(--card)}
legend{font-family:"JetBrains Mono",monospace;font-size:.62rem;letter-spacing:.12em;text-transform:uppercase;
       color:var(--ink3);padding:0 7px}
fieldset.locked{background:var(--card2)}
fieldset.locked legend{color:var(--accent)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:13px}
label{display:block;font-size:.72rem;font-weight:600;color:var(--ink3);
      text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px}
input,textarea{width:100%;font:inherit;font-size:.9rem;padding:8px 10px;border-radius:3px;
               border:1px solid var(--rule);background:var(--paper);color:var(--ink)}
input:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:transparent}
textarea{resize:vertical;min-height:62px;line-height:1.5}
.hint{font-size:.76rem;color:var(--ink3);margin:5px 0 0;line-height:1.45}
.ro{display:flex;justify-content:space-between;gap:12px;padding:6px 0;border-bottom:1px solid var(--rule2);font-size:.86rem}
.ro:last-child{border-bottom:none}
.ro span:first-child{color:var(--ink3)}
.ro span:last-child{font-family:"JetBrains Mono",monospace;font-variant-numeric:tabular-nums;text-align:right}
.ro .bad{color:var(--flag)} .ro .warnv{color:var(--warn)}
.full{grid-column:1/-1}
.bar{position:sticky;bottom:0;display:flex;align-items:center;gap:10px;padding:12px 26px;
     background:var(--card);border-top:1px solid var(--rule);
     box-shadow:0 -10px 18px -14px rgba(0,0,0,.45)}
.saved{font-size:.8rem;color:var(--ok)}
.banner{padding:11px 14px;border-radius:3px;font-size:.85rem;margin-bottom:16px;line-height:1.5}
.banner.warn{background:var(--warnbg);color:var(--warn)}
.banner.info{background:var(--accentbg);color:var(--accent)}
.banner.err{background:var(--flagbg);color:var(--flag)}
.banner a{color:inherit}

/* ---- preview ---- */
.preview{border-left:1px solid var(--rule);display:grid;grid-template-rows:auto 1fr;background:var(--card2);min-height:0}
.tabs{display:flex;gap:0;border-bottom:1px solid var(--rule);background:var(--card)}
.tabs button{border:none;border-radius:0;background:none;padding:10px 15px;font-size:.78rem;
             color:var(--ink3);border-bottom:2px solid transparent;font-family:"JetBrains Mono",monospace}
.tabs button[aria-selected=true]{color:var(--accent);border-bottom-color:var(--accent)}
.preview iframe{width:100%;height:100%;border:none;background:#fff}
.spin{display:inline-block;width:11px;height:11px;border:2px solid currentColor;border-right-color:transparent;
      border-radius:50%;animation:s .7s linear infinite;vertical-align:-1px;margin-right:6px}
@keyframes s{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){.spin{animation:none}}
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>Mise Studio</h1>
    <span class="env mono" id="env">—</span>
    <span class="grow"></span>
    <span id="kpis"></span>
    <button class="primary" id="rebuild">Sync &amp; rebuild</button>
  </header>

  <div class="cols" id="cols">
    <div class="list" id="list"></div>
    <div class="editor" id="editor"><div class="empty">Select an item.</div></div>
    <div class="preview">
      <div class="tabs" role="tablist">
        <button role="tab" aria-selected="true" data-p="guest.html">guest menu</button>
        <button role="tab" aria-selected="false" data-p="service.html">service</button>
        <button role="tab" aria-selected="false" data-p="print.html">print draft</button>
      </div>
      <iframe id="frame" title="Preview"></iframe>
    </div>
  </div>
</div>

<script>
"use strict";
const $ = s => document.querySelector(s);
let S = { items: [], stats: null }, selected = null, dirty = false;

const esc = t => String(t ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const money = n => n == null ? '—' : '$' + Number(n).toFixed(0);

async function load() {
  S = await (await fetch('/api/state')).json();
  $('#env').textContent = S.env || '—';
  const gt = document.querySelector('.tabs button[data-p="guest.html"]');
  if (gt) gt.textContent = S.siteDevUrl ? 'guest menu · live site' : 'guest menu';
  if (!S.ready) {
    $('#list').innerHTML = '';
    $('#editor').innerHTML = '<div class="empty">Nothing built yet. Hit <b>Sync &amp; rebuild</b>.</div>';
    return;
  }
  renderKpis(); renderList();
  if (selected) select(selected, true);
}

function renderKpis() {
  const s = S.stats || {};
  const bits = [
    ['', `${s.published} published`],
    s.heldBack ? ['warn', `${s.heldBack} need copy`] : null,
    s.soldOut ? ['flag', `${s.soldOut} 86'd`] : null,
    s.staleVintages ? ['warn', `${s.staleVintages} stale vintage${s.staleVintages===1?'':'s'}`] : null,
  ].filter(Boolean);
  $('#kpis').innerHTML = bits.map(([c,t]) => `<span class="kpi ${c}">${esc(t)}</span>`).join(' ');
}

function renderList() {
  const stubs = S.items.filter(i => i.needsReview);
  let h = '';
  if (stubs.length) {
    h += `<div class="queue"><h2>${stubs.length} need${stubs.length===1?'s':''} copy</h2>` +
         `<p>Staff can see these. Guests can't, until you name them.</p></div>`;
  }
  const bySec = new Map();
  for (const i of S.items) {
    if (!bySec.has(i.section)) bySec.set(i.section, []);
    bySec.get(i.section).push(i);
  }
  for (const [sec, items] of bySec) {
    h += `<div class="sec">${esc(sec)}</div>`;
    for (const i of items) {
      const name = i.editorial.producer
        ? i.editorial.producer + (i.editorial.cuvee ? ` ‘${i.editorial.cuvee}’` : '')
        : (i.editorial.menu_name || '—');
      h += `<button class="row${i.needsReview?' stub':''}" data-id="${esc(i.id)}" aria-current="${i.id===selected}">` +
           `<span class="n">${esc(name)}` +
             (i.needsReview ? '<span class="dot stub" title="needs copy"></span>' : '') +
             (!i.square.available ? '<span class="dot out" title="86\'d"></span>' : '') +
             (i.square.staleVintage ? '<span class="dot stale" title="stale vintage"></span>' : '') +
           `</span><span class="p">${esc(i.square.posName)}</span></button>`;
    }
  }
  $('#list').innerHTML = h;
  $('#list').querySelectorAll('.row').forEach(b =>
    b.addEventListener('click', () => select(b.dataset.id)));
}

function select(id, keepScroll) {
  if (dirty && !keepScroll && !confirm('Discard unsaved changes?')) return;
  selected = id; dirty = false;
  const i = S.items.find(x => x.id === id);
  $('#list').querySelectorAll('.row').forEach(b =>
    b.setAttribute('aria-current', String(b.dataset.id === id)));
  if (!i) return;

  const q = i.square, e = i.editorial, wine = q.kind === 'pour';
  const f = (k, label, ph = '', type = 'input', cls = '') =>
    `<div class="${cls}"><label for="f_${k}">${esc(label)}</label>` +
    (type === 'textarea'
      ? `<textarea id="f_${k}" data-k="${k}" placeholder="${esc(ph)}">${esc(e[k])}</textarea>`
      : `<input id="f_${k}" data-k="${k}" value="${esc(e[k])}" placeholder="${esc(ph)}">`) + `</div>`;

  const ro = (l, v, cls = '') => `<div class="ro"><span>${esc(l)}</span><span class="${cls}">${v}</span></div>`;

  $('#editor').innerHTML = `<div class="pad">
    <div class="crumb">${esc(i.section)} &middot; ${esc(i.id)}</div>
    <h2>${esc(e.producer ? e.producer + (e.cuvee ? ` ‘${e.cuvee}’` : '') : (e.menu_name || q.posName))}</h2>

    ${i.needsReview ? `<div class="banner warn"><b>Held back from the guest menu.</b>
      This came from the POS with no copy. It's already visible to staff in the service
      reference. Give it a name below and it publishes on the next rebuild.</div>` : ''}
    ${i.squareOwnsCopy ? `<div class="banner info"><b>Menu name is set in Square.</b>
      Whoever edits it in the Square dashboard wins over anything typed here — that's deliberate,
      so the restaurant can always correct its own menu. Anything you type is the fallback.</div>` : ''}

    <fieldset class="locked"><legend>From Square — edit in the Square dashboard</legend>
      ${ro('POS button', `<b>${esc(q.posName)}</b>`)}
      ${wine
        ? ro('Glass', q.glass == null ? '—' : money(q.glass) + (q.glassAvailable === false ? ' · 86’d' : ''),
             q.glassAvailable === false ? 'bad' : '') +
          ro('Bottle', money(q.bottle) + (q.bottleAvailable === false ? ' · 86’d' : ''),
             q.bottleAvailable === false ? 'bad' : '')
        : ro('Price', money(q.price))}
      ${q.stock != null ? ro('In stock', q.stock, q.stock <= 1 ? 'warnv' : '') : ''}
      ${wine ? ro('Vintage', q.vintage ?? 'NV') : ''}
      ${wine ? ro('Vintage confirmed',
          q.vintageAgeMonths == null ? 'never' : q.vintageAgeMonths + ' months ago',
          q.staleVintage || q.vintageAgeMonths == null ? 'warnv' : '') : ''}
      ${ro('Available', q.available ? 'yes' : "86’d", q.available ? '' : 'bad')}
      <p class="hint">Price, availability and vintage are the restaurant's to change, on the
      terminal or in the Square dashboard. This tool never writes to Square.</p>
    </fieldset>

    <fieldset><legend>Menu copy — what guests read</legend>
      <div class="grid">
        ${f('menu_name', 'Menu name', wine ? 'Domaine Vacheron' : 'Parasol Benedict', 'input', 'full')}
        ${f('description', 'Description', wine ? 'left blank for wine — grape and region are built from the fields below' : 'poached eggs, chive hollandaise', 'textarea', 'full')}
        ${f('allergens', 'Allergens', 'egg, gluten, dairy', 'input', 'full')}
      </div>
      <p class="hint">A menu name is what publishes this to guests. Without one it stays
      in the service reference only.</p>
    </fieldset>

    ${wine ? `<fieldset><legend>Wine detail</legend>
      <div class="grid">
        ${f('producer', 'Producer', 'Domaine Vacheron')}
        ${f('cuvee', 'Cuvée', 'Barrel X')}
        ${f('grape', 'Grape', 'Sauvignon Blanc')}
        ${f('region', 'Region', 'Sancerre, France')}
        ${f('importer', 'Importer', 'Kermit Lynch')}
      </div>
      <p class="hint">Producer and cuvée become the name on the list. Grape and region
      become the line underneath.</p>
    </fieldset>` : ''}

    <fieldset><legend>Service only — never shown to guests</legend>
      <div class="grid">
        ${f('service_note', 'Service note', 'Needs air. Decant if the table is staying.', 'textarea', 'full')}
        ${f('pairing', 'Pairing', 'Peter Lauer Riesling')}
        ${f('sort_index', 'Order in section', '0')}
      </div>
    </fieldset>
  </div>
  <div class="bar">
    <button class="primary" id="save">Save</button>
    <button class="ghost" id="revert">Revert</button>
    <span id="savedmsg"></span>
  </div>`;

  $('#editor').querySelectorAll('input,textarea').forEach(el =>
    el.addEventListener('input', () => { dirty = true; $('#savedmsg').textContent = ''; }));
  $('#save').addEventListener('click', save);
  $('#revert').addEventListener('click', () => select(selected, true));
}

async function save() {
  const patch = {};
  $('#editor').querySelectorAll('[data-k]').forEach(el => patch[el.dataset.k] = el.value);
  $('#save').disabled = true;
  const r = await (await fetch('/api/item/' + encodeURIComponent(selected), {
    method: 'PUT', headers: { 'content-type': 'application/json' }, body: JSON.stringify(patch),
  })).json();
  $('#save').disabled = false;
  dirty = false;
  $('#savedmsg').innerHTML = `<span class="saved">Saved${r.commit ? ' · ' + r.commit : ''}. Rebuild to publish.</span>`;
}

async function rebuild() {
  const btn = $('#rebuild');
  btn.disabled = true;
  btn.innerHTML = '<span class="spin"></span>Rebuilding…';
  const r = await (await fetch('/api/rebuild', { method: 'POST' })).json();
  btn.disabled = false;
  btn.textContent = 'Sync & rebuild';
  if (!r.ok) {
    alert('Build refused to publish:\n\n' + (r.problems?.length ? r.problems.join('\n') : r.error) +
          '\n\nThe last good output is untouched.');
    return;
  }
  await load();
  refreshPreview();
}

function refreshPreview() {
  const tab = document.querySelector('.tabs button[aria-selected=true]');
  /* With the React site's dev server running, preview the real thing rather
     than Mise's standalone approximation of it. */
  if (tab.dataset.p === 'guest.html' && S.siteDevUrl) {
    $('#frame').src = S.siteDevUrl + (S.siteDevUrl.includes('?') ? '&' : '?') + 't=' + Date.now();
    return;
  }
  $('#frame').src = '/preview/' + tab.dataset.p + '?t=' + Date.now();
}

document.querySelectorAll('.tabs button').forEach(b => b.addEventListener('click', () => {
  document.querySelectorAll('.tabs button').forEach(o => o.setAttribute('aria-selected', String(o === b)));
  refreshPreview();
}));
$('#rebuild').addEventListener('click', rebuild);
window.addEventListener('beforeunload', e => { if (dirty) e.preventDefault(); });

load().then(refreshPreview);
</script>
</body>
</html>
